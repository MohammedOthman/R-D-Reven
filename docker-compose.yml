services:
  postgres:
    image: postgres:16-alpine
    container_name: revn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revn
      POSTGRES_PASSWORD: revn
      POSTGRES_DB: revn_dev
    ports:
      - "5432:5432"
    volumes:
      - revn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revn -d revn_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  revn_pgdata:
